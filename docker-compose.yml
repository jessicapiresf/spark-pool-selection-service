# `docker compose up` para quem quer ver funcionando sem nada instalado na maquina. Quem vai
# desenvolver usa `make dev`, que nao precisa de Docker e nao reconstroi imagem a cada
# mudanca.
#
# O perfil padrao nao sobe AWS simulada: o snapshot fica num volume compartilhado entre o
# seed e a API. `docker compose --profile aws up` sobe o LocalStack e exercita os adapters.

services:
  seed:
    build: .
    environment: &local_env
      SNAPSHOT_PATH: /dados/snapshot/pools.json.gz
      EVENTS_PATH: /dados/eventos.jsonl
    volumes:
      - dados:/dados
    command: ["python", "tools/seed_local.py", "--mode", "file"]

  api:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "5050:5050"
    environment:
      <<: *local_env
      FALLBACK_POOLS: pool-r6.xlarge-us-east-1a,pool-c6.xlarge-us-east-1a
    volumes:
      - dados:/dados
    command:
      ["uvicorn", "pool_selection.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "5050"]

  localstack:
    profiles: ["aws"]
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,sqs
      DEBUG: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  dados:
