[project]
name = "pool-selection"
version = "0.1.0"
description = "API REST que indica o pool de instancias spot com maior chance de um job Spark terminar"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "mangum>=0.19",
    "boto3>=1.35",
    "urllib3>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "moto[s3,sqs,dynamodb]>=5.0",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3-stubs[s3,sqs,dynamodb,ec2]>=1.35",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pool_selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: testes que levam mais de um segundo",
]
filterwarnings = ["error::DeprecationWarning:pool_selection.*"]

[tool.coverage.run]
source = ["src/pool_selection/domain"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "RET", "ARG"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.13"
files = ["src/pool_selection"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pool_selection.adapters.*", "pool_selection.entrypoints.*", "mangum.*", "moto.*"]
ignore_errors = true
